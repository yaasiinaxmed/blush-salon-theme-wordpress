name: ✨ Feature request
description: Suggest an idea or improvement for the theme
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who needs it and why?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like. Mockups and examples are welcome.
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Want to help?
      options:
        - label: I would like to work on this myself
